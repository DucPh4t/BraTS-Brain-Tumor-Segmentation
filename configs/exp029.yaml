# ============================================================
# Exp029 — Giai đoạn L: Checkpoint Attention + Dự báo TTA
# Mô hình nền tảng: Checkpoint của Exp018, không huấn luyện lại
# Thay đổi: Lấy trung bình bản đồ xác suất ảnh gốc và ảnh lật với mô hình Attention
# Mục tiêu: Đánh giá TTA trên Attention U-Net
# ============================================================

exp_name: "exp029"
description: "Nhóm L Exp029 — Exp018 Attention U-Net frozen checkpoint + TTA inference"

data:
  root_dir: "KAGGLE_PATH"
  split_type: "stratified"
  slice_range: [0, 155]
  normalization: "zscore_clip"
  augmentation: false
  sampling: "fixed"
  cache_volumes: false
  context_slices: 0
  min_tumor_pixels: 100

model:
  name: "AttentionUNet2D"
  architecture: "attention_unet2d"
  in_channels: 4
  num_classes: 3
  init_features: 64

training:
  epochs: 0
  batch_size: 16
  lr: 0.0001
  loss: "dice_bce"
  loss_params:
    dice_weight: 0.5
  optimizer: "adamw"
  num_workers: 0
  pin_memory: true
  monitor_metric: "mean_val_dice"

evaluation:
  source_exp: "exp018"
  checkpoint_path: "outputs/exp018/best_model.pth"
  split: "test"
  batch_size: 16
  thresholds:
    WT: 0.5
    TC: 0.5
    ET: 0.5
  tta:
    enabled: true
    flips: ["none", "h", "w", "hw"]
  postprocess:
    enabled: false
    enforce_hierarchy: true
  et_rescue:
    enabled: false
