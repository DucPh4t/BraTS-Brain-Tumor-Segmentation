# ============================================================
# Exp048 — Exp043 + Ràng buộc ranh giới chỉ áp dụng cho ET
# Mô hình nền tảng: Exp043 ResNet34 + Nhánh vùng u + Ràng buộc phân cấp
# Thay đổi: Chỉ áp dụng ràng buộc ranh giới mềm cho ET
# Mục tiêu: Đánh giá độc lập hiệu quả ranh giới trên vùng ET khó nhất
# ============================================================

exp_name: "exp048"
description: "Nhóm U Exp048 — Exp043 + ET-only boundary consistency loss"

data:
  root_dir: "KAGGLE_PATH"
  split_type: "stratified"
  slice_range: [0, 155]
  normalization: "zscore_clip"
  augmentation: true
  sampling: "fixed"
  cache_volumes: true
  context_slices: 0
  min_tumor_pixels: 100

model:
  name: "ResNet34RegionHeadsUNet2D"
  architecture: "resnet34_region_heads_unet2d"
  in_channels: 4
  num_classes: 3
  init_features: 64
  encoder_weights: "imagenet"

training:
  epochs: 30
  batch_size: 16
  lr: 0.0001
  loss: "dice_bce"
  loss_params:
    dice_weight: 0.5
    hierarchy_weight: 0.1
    boundary_weight: 0.05
    boundary_kernel_size: 3
    boundary_channel: "ET"
  optimizer: "adamw"
  num_workers: 0
  pin_memory: true
  monitor_metric: "mean_val_dice"
