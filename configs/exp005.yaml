# ============================================================
# Exp005 — Z-score + Percentile clip (độc lập)
# Mô hình nền tảng: Exp004
# Thay đổi: Chạy lặp lại để đánh giá độ tin cậy của phương pháp chuẩn hóa
# Mục tiêu: Xác nhận hiệu quả của Z-score clip
# ============================================================

exp_name: "exp005"
description: "Nhóm C Exp005 — Spatial Augmentation: Random Flip H/V"

data:
  root_dir: "KAGGLE_PATH"
  split_type: "stratified"
  slice_range: [0, 155]
  normalization: "zscore_clip"
  augmentation: true
  sampling: "fixed"
  cache_volumes: true
  context_slices: 0
  min_tumor_pixels: 100

model:
  name: "UNet2D"
  in_channels: 4
  out_channels: 3
  init_features: 32

training:
  epochs: 30
  batch_size: 16
  lr: 0.0001
  loss: "dice"
  optimizer: "adam"
  num_workers: 0
  pin_memory: true
  monitor_metric: "mean_val_dice"
