# ============================================================
# Exp042 — Nâng cấp Backbone: ResNet34 U-Net
# Mô hình nền tảng: Dòng encoder shallow DoubleConv cũ
# Thay đổi: Bộ mã hóa ResNet34 sâu hơn kết hợp bộ giải mã U-Net
# Mục tiêu: Kiểm tra sức mạnh biểu diễn đặc trưng của backbone mới
# ============================================================

exp_name: "exp042"
description: "Nhóm Q Exp042 — ResNet34 U-Net backbone baseline"

data:
  root_dir: "KAGGLE_PATH"
  split_type: "stratified"
  slice_range: [0, 155]
  normalization: "zscore_clip"
  augmentation: true
  sampling: "fixed"
  cache_volumes: true
  context_slices: 0
  min_tumor_pixels: 100

model:
  name: "ResNet34UNet2D"
  architecture: "resnet34_unet2d"
  in_channels: 4
  num_classes: 3
  init_features: 64
  encoder_weights: "imagenet"

training:
  epochs: 30
  batch_size: 16
  lr: 0.0001
  loss: "dice_bce"
  loss_params:
    dice_weight: 0.5
  optimizer: "adamw"
  num_workers: 0
  pin_memory: true
  monitor_metric: "mean_val_dice"
