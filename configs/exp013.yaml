# ============================================================
# Exp013 — Nhóm F: Optimizer & Scheduler
# Mô hình nền tảng: Exp011
# Thay đổi: Sử dụng bộ tối ưu AdamW
# Mục tiêu: Kiểm soát suy giảm trọng số (weight decay)
# ============================================================

exp_name: "exp013"
description: "Nhóm F Exp013 — AdamW, no scheduler"

data:
  root_dir: "KAGGLE_PATH"
  split_type: "stratified"
  slice_range: [0, 155]
  normalization: "zscore_clip"
  augmentation: true
  sampling: "fixed"
  cache_volumes: true
  context_slices: 0
  min_tumor_pixels: 100

model:
  name: "UNet2D"
  in_channels: 4
  out_channels: 3
  init_features: 32

training:
  epochs: 30
  batch_size: 16
  lr: 0.0001
  loss: "dice_bce"
  loss_params:
    dice_weight: 0.5
  optimizer: "adamw"
  num_workers: 0
  pin_memory: true
  monitor_metric: "mean_val_dice"
