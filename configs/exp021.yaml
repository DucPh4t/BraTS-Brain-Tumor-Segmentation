# ============================================================
# Exp021 — Kết hợp shared/private gọn nhẹ (Disentangled Fusion Lite)
# Mô hình nền tảng: Exp019
# Thay đổi: Thêm các nhánh chung/riêng (shared/private) kết hợp lọc qua cổng (gated fusion)
# Mục tiêu: Thử nghiệm cơ chế kết hợp kiểu DFuse-Net trong cấu hình 2D
# ============================================================

exp_name: "exp021"
description: "Nhóm H Exp021 — Disentangled Fusion Lite with shared/private modality branches"

data:
  root_dir: "KAGGLE_PATH"
  split_type: "stratified"
  slice_range: [0, 155]
  normalization: "zscore_clip"
  augmentation: true
  sampling: "fixed"
  cache_volumes: true
  context_slices: 0
  min_tumor_pixels: 100

model:
  name: "DisentangledFusionUNet2D"
  architecture: "disentangled_fusion_unet2d"
  in_channels: 4
  num_classes: 3
  init_features: 64
  return_features: false

training:
  epochs: 30
  batch_size: 16
  lr: 0.0001
  loss: "dice_bce"
  loss_params:
    dice_weight: 0.5
  optimizer: "adamw"
  num_workers: 0
  pin_memory: true
  monitor_metric: "mean_val_dice"
