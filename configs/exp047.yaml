# ============================================================
# Exp047 — Exp043 + Hàm mất mát thích ứng cho ca dương tính ET
# Mô hình nền tảng: Exp043 ResNet34 + Nhánh vùng u + Ràng buộc phân cấp
# Thay đổi: Chỉ tăng trọng số phần dương tính / bỏ sót (false negative) của ET
# Mục tiêu: Tối ưu hóa độ nhạy của vùng ET
# ============================================================

exp_name: "exp047"
description: "Nhóm T Exp047 — Exp043 + ET-positive adaptive BCE"

data:
  root_dir: "KAGGLE_PATH"
  split_type: "stratified"
  slice_range: [0, 155]
  normalization: "zscore_clip"
  augmentation: true
  sampling: "fixed"
  cache_volumes: true
  context_slices: 0
  min_tumor_pixels: 100

model:
  name: "ResNet34RegionHeadsUNet2D"
  architecture: "resnet34_region_heads_unet2d"
  in_channels: 4
  num_classes: 3
  init_features: 64
  encoder_weights: "imagenet"

training:
  epochs: 30
  batch_size: 16
  lr: 0.0001
  loss: "et_positive_adaptive_dice_bce"
  loss_params:
    dice_weight: 0.5
    positive_multiplier: 1.5
    hierarchy_weight: 0.1
  optimizer: "adamw"
  num_workers: 0
  pin_memory: true
  monitor_metric: "mean_val_dice"
