# ============================================================
# Exp012 — Nhóm E: Loss Function
# Mô hình nền tảng: Exp011
# Thay đổi: Sử dụng hàm mất mát Dice + Focal Tversky
# Mục tiêu: Tối ưu hóa chỉ số WT và ET/TC
# ============================================================

exp_name: "exp012"
description: "Nhóm E Exp012 — Dice + Focal Tversky combo"

data:
  root_dir: "KAGGLE_PATH"
  split_type: "stratified"
  slice_range: [0, 155]
  normalization: "zscore_clip"
  augmentation: true
  sampling: "fixed"
  cache_volumes: true
  context_slices: 0
  min_tumor_pixels: 100

model:
  name: "UNet2D"
  in_channels: 4
  out_channels: 3
  init_features: 32

training:
  epochs: 30
  batch_size: 16
  lr: 0.0001
  loss: "dice_focal"
  loss_params:
    dice_weight: 0.5
    alpha: 0.7
    beta: 0.3
    gamma: 1.3333
  optimizer: "adam"
  num_workers: 0
  pin_memory: true
  monitor_metric: "mean_val_dice"
