# ============================================================
# Exp009 — Nhóm E: Loss Function
# Mô hình nền tảng: Exp005
# Thay đổi: Sử dụng hàm mất mát BCE
# Mục tiêu: So sánh hiệu quả phân đoạn của BCE
# ============================================================

exp_name: "exp009"
description: "Nhóm E Exp009 — BCE Loss thuần"

data:
  root_dir: "KAGGLE_PATH"
  split_type: "stratified"
  slice_range: [0, 155]
  normalization: "zscore_clip"
  augmentation: true
  sampling: "fixed"
  cache_volumes: true
  context_slices: 0
  min_tumor_pixels: 100

model:
  name: "UNet2D"
  in_channels: 4
  out_channels: 3
  init_features: 32

training:
  epochs: 30
  batch_size: 16
  lr: 0.0001
  loss: "bce"
  optimizer: "adam"
  num_workers: 0
  pin_memory: true
  monitor_metric: "mean_val_dice"
