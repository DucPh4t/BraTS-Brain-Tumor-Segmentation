# ============================================================
# Exp052 — Bộ thích ứng Mamba 2.5D gọn nhẹ trước khi kết hợp phương thái
# Mô hình nền tảng: Exp043 (ResNet34 + Nhánh vùng u + Ràng buộc phân cấp)
# Thay đổi: Mỗi phương thái độc lập sử dụng 5 lát cắt qua bộ thích ứng CNN-Mamba chia sẻ
# Mục tiêu: Khai thác ngữ cảnh 3D trước khi fusion
# ============================================================

exp_name: "exp052"
description: "Nhóm X Exp052 — Lightweight pre-fusion 2.5D Mamba adapter + Exp043 trunk"

data:
  root_dir: "KAGGLE_PATH"
  split_type: "stratified"
  slice_range: [0, 155]
  normalization: "zscore_clip"
  augmentation: true
  sampling: "fixed"
  cache_volumes: true
  context_slices: 5
  min_tumor_pixels: 100

model:
  name: "Hybrid2_5DMambaRegionHeadsUNet"
  architecture: "hybrid_2_5d_mamba_region_heads_unet"
  in_channels: 20
  num_classes: 3
  num_modalities: 4
  init_features: 64
  encoder_weights: "imagenet"
  require_encoder_weights: true
  adapter:
    context_channels: [8, 16, 32]
    reconstruction_channels: [16, 8, 8]
    residual_scale_init: 1.0
    zero_init_delta: true
  mamba:
    num_layers: 1
    d_model: 32
    d_state: 16
    d_conv: 4
    expand: 2
    scan_orders: 4
    residual_scale_init: 0.1

training:
  epochs: 30
  batch_size: 16
  gradient_accumulation_steps: 1
  effective_batch_size: 16
  lr: 0.0001
  loss: "dice_bce"
  loss_params:
    dice_weight: 0.5
    hierarchy_weight: 0.1
  optimizer: "adamw"
  scheduler: "none"
  num_workers: 0
  pin_memory: true
  monitor_metric: "mean_val_dice"
  seed: 42

evaluation:
  split: "test"
  batch_size: 1
  thresholds:
    WT: 0.5
    TC: 0.5
    ET: 0.5
  tta:
    enabled: false
  postprocess:
    enabled: false
    enforce_hierarchy: true
  et_rescue:
    enabled: false
    restrict_to_tc: true
